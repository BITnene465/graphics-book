<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-labelledby="title">
<title id="title">先旋转后平移与先平移后旋转</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="880" height="390" fill="#f5f7ee" rx="8"/>
<g font-family="system-ui, PingFang SC, sans-serif"><text x="54" y="38" fill="#304b3b" font-size="23" text-anchor="start">同一个点，同两次操作，不同的顺序</text><line x1="85" y1="275" x2="330" y2="275" stroke="#9dad9d" stroke-width="2" marker-end="url(#arrow)"/><line x1="130" y1="300" x2="130" y2="74" stroke="#9dad9d" stroke-width="2" marker-end="url(#arrow)"/><text x="328" y="299" fill="#304b3b" font-size="16" text-anchor="start">x</text><text x="107" y="83" fill="#304b3b" font-size="16" text-anchor="start">y</text><line x1="185" y1="275" x2="130" y2="220" stroke="#9dad9d" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><line x1="130" y1="220" x2="240" y2="220" stroke="#386c50" stroke-width="3" marker-end="url(#arrow)"/><circle cx="185" cy="275" r="6" fill="#507fac" stroke="#fcfcf7" stroke-width="2"/><circle cx="130" cy="220" r="6" fill="#9dad9d" stroke="#fcfcf7" stroke-width="2"/><circle cx="240" cy="220" r="6" fill="#386c50" stroke="#fcfcf7" stroke-width="2"/><text x="194" y="299" fill="#507fac" font-size="17" text-anchor="start">p</text><text x="249" y="210" fill="#386c50" font-size="17" text-anchor="start">结果</text><text x="85" y="330" fill="#304b3b" font-size="19" text-anchor="start">先 R，再 T</text><text x="85" y="360" fill="#304b3b" font-size="18" text-anchor="start">T R p = (2, 1)</text><line x1="520" y1="275" x2="765" y2="275" stroke="#9dad9d" stroke-width="2" marker-end="url(#arrow)"/><line x1="565" y1="300" x2="565" y2="74" stroke="#9dad9d" stroke-width="2" marker-end="url(#arrow)"/><text x="763" y="299" fill="#304b3b" font-size="16" text-anchor="start">x</text><text x="542" y="83" fill="#304b3b" font-size="16" text-anchor="start">y</text><line x1="620" y1="275" x2="730" y2="275" stroke="#9dad9d" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow)"/><line x1="730" y1="275" x2="565" y2="110" stroke="#386c50" stroke-width="3" marker-end="url(#arrow)"/><circle cx="620" cy="275" r="6" fill="#507fac" stroke="#fcfcf7" stroke-width="2"/><circle cx="730" cy="275" r="6" fill="#9dad9d" stroke="#fcfcf7" stroke-width="2"/><circle cx="565" cy="110" r="6" fill="#386c50" stroke="#fcfcf7" stroke-width="2"/><text x="629" y="299" fill="#507fac" font-size="17" text-anchor="start">p</text><text x="574" y="100" fill="#386c50" font-size="17" text-anchor="start">结果</text><text x="520" y="330" fill="#304b3b" font-size="19" text-anchor="start">先 T，再 R</text><text x="520" y="360" fill="#304b3b" font-size="18" text-anchor="start">R T p = (0, 3)</text></g></svg>