<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" role="img" aria-labelledby="title">
<title id="title">虚拟成像平面与透视相似三角形</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="880" height="410" fill="#f5f7ee" rx="8"/>
<g font-family="system-ui, PingFang SC, sans-serif"><text x="54" y="38" fill="#304b3b" font-size="23" text-anchor="start">相似三角形，把深度变成缩放</text><line x1="100" y1="270" x2="800" y2="270" stroke="#9dad9d" stroke-width="2" marker-end="url(#arrow)"/><text x="725" y="300" fill="#304b3b" font-size="19" text-anchor="start">d = −z</text><line x1="120" y1="300" x2="120" y2="74" stroke="#9dad9d" stroke-width="2" marker-end="url(#arrow)"/><text x="92" y="80" fill="#304b3b" font-size="19" text-anchor="start">y</text><line x1="350" y1="90" x2="350" y2="320" stroke="#386c50" stroke-width="3"/><text x="350" y="348" fill="#304b3b" font-size="18" text-anchor="middle">虚拟成像平面 d = f</text><line x1="120" y1="270" x2="730" y2="95" stroke="#507fac" stroke-width="2"/><line x1="730" y1="95" x2="730" y2="270" stroke="#9dad9d" stroke-width="2" stroke-dasharray="7 6"/><polygon points="120,270 350,270 350,204" fill="#386c50" fill-opacity="0.13" stroke="#386c50" stroke-width="2"/><circle cx="120" cy="270" r="6" fill="#9dad9d" stroke="#fcfcf7" stroke-width="2"/><text x="85" y="324" fill="#304b3b" font-size="18" text-anchor="start">相机 O</text><circle cx="730" cy="95" r="6" fill="#507fac" stroke="#fcfcf7" stroke-width="2"/><text x="718" y="75" fill="#507fac" font-size="18" text-anchor="start">P = (x, y, −d)</text><circle cx="350" cy="204" r="6" fill="#386c50" stroke="#fcfcf7" stroke-width="2"/><text x="368" y="207" fill="#386c50" font-size="21" text-anchor="start">y′</text><text x="550" y="340" fill="#304b3b" font-size="23" text-anchor="start">y′ / f = y / d</text><text x="550" y="368" fill="#386c50" font-size="23" text-anchor="start">y′ = f y / d</text></g></svg>