<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" role="img" aria-labelledby="title">
<title id="title">重心坐标的对面有向面积分解</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="880" height="390" fill="#f5f7ee" rx="8"/>
<g font-family="system-ui, PingFang SC, sans-serif"><text x="54" y="38" fill="#304b3b" font-size="23" text-anchor="start">对面面积，决定这个顶点的权重</text><polygon points="180,255 420,315 100,75" fill="#c85f4e" fill-opacity="0.2" stroke="#c85f4e" stroke-width="2"/><polygon points="180,255 100,75 100,315" fill="#386c50" fill-opacity="0.2" stroke="#386c50" stroke-width="2"/><polygon points="180,255 100,315 420,315" fill="#507fac" fill-opacity="0.2" stroke="#507fac" stroke-width="2"/><circle cx="100" cy="315" r="6" fill="#c85f4e" stroke="#fcfcf7" stroke-width="2"/><text x="110" y="305" fill="#c85f4e" font-size="21" text-anchor="start">A</text><circle cx="420" cy="315" r="6" fill="#386c50" stroke="#fcfcf7" stroke-width="2"/><text x="430" y="305" fill="#386c50" font-size="21" text-anchor="start">B</text><circle cx="100" cy="75" r="6" fill="#507fac" stroke="#fcfcf7" stroke-width="2"/><text x="110" y="65" fill="#507fac" font-size="21" text-anchor="start">C</text><circle cx="180" cy="255" r="6" fill="#386c50" stroke="#fcfcf7" stroke-width="2"/><text x="190" y="245" fill="#386c50" font-size="21" text-anchor="start">P</text><text x="505" y="120" fill="#c85f4e" font-size="20" text-anchor="start">λA = S(PBC) / S(ABC) = 1/2</text><text x="505" y="177" fill="#386c50" font-size="20" text-anchor="start">λB = S(PCA) / S(ABC) = 1/4</text><text x="505" y="234" fill="#507fac" font-size="20" text-anchor="start">λC = S(PAB) / S(ABC) = 1/4</text><text x="505" y="303" fill="#304b3b" font-size="21" text-anchor="start">权重之和 = 1</text><text x="100" y="358" fill="#304b3b" font-size="20" text-anchor="start">P = 0.5 A + 0.25 B + 0.25 C</text></g></svg>